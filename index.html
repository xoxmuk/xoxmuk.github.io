<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="desktop">
    <section class="window" data-ui-aria="windowLabel">
      <header class="titlebar">
        <div class="title"><span class="title-icon" data-ui="windowIcon"></span><span id="pageTitle"></span></div>
        <div class="window-controls" aria-hidden="true">
          <button data-ui="minimizeIcon"></button><button data-ui="maximizeIcon"></button><button class="close" data-ui="closeIcon"></button>
        </div>
      </header>

      <nav class="menubar" data-ui-aria="menuLabel">
        <button data-view="about" data-menu="about"></button>
        <button data-view="projects" data-menu="projects"></button>
        <button data-view="skills" data-menu="skills"></button>
        <button data-view="contact" data-menu="contact"></button>
      </nav>

      <div class="toolbar">
        <button id="backButton" data-ui="backIcon" data-ui-title="backLabel"></button>
        <button id="forwardButton" data-ui="forwardIcon" data-ui-title="forwardLabel"></button>
        <div class="address"><span data-ui="addressLabel"></span><div><span class="address-icon" data-ui="addressIcon"></span><span id="addressText"></span></div></div>
      </div>

      <div class="content">
        <aside class="sidebar">
          <article class="sidebar-panel">
            <h2 data-ui="sidebarTitle"></h2>
            <div class="sidebar-links">
              <button data-view="projects" data-sidebar="projects"></button>
              <button data-view="skills" data-sidebar="skills"></button>
              <button data-view="contact" data-sidebar="contact"></button>
            </div>
          </article>
        </aside>

        <article class="main-area" id="mainArea"></article>
      </div>

      <footer class="statusbar"><span id="statusText"></span><span class="resize-grip"></span></footer>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
