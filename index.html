<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Моё портфолио</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="desktop">
    <section class="window" aria-label="Портфолио">
      <header class="titlebar">
        <div class="title"><span class="title-icon">🗂️</span><span id="pageTitle">xoxmuk.github.io</span></div>
        <div class="window-controls" aria-hidden="true">
          <button>_</button><button>□</button><button class="close">×</button>
        </div>
      </header>

      <nav class="menubar" aria-label="Меню">
        <button data-view="about"><u>О</u>бо мне</button>
        <button data-view="projects"><u>П</u>роекты</button>
        <button data-view="skills"><u>Н</u>авыки</button>
        <button data-view="contact"><u>К</u>онтакты</button>
      </nav>

      <div class="toolbar">
        <button id="backButton" title="Назад">←</button>
        <button id="forwardButton" title="Вперёд">→</button>
        <div class="address"><span>Адрес</span><div><span class="address-icon">🖥️</span><span id="addressText">Портфолио</span></div></div>
      </div>

      <div class="content">
        <aside class="sidebar">
          <article class="sidebar-panel">
            <h2>Системные задачи</h2>
            <div class="sidebar-links">
              <button data-view="projects">Просмотреть проекты</button>
              <button data-view="skills">Посмотреть навыки</button>
              <button data-view="contact">Связаться со мной</button>
            </div>
          </article>
        </aside>

        <article class="main-area" id="mainArea">
        </article>
      </div>

      <footer class="statusbar"><span id="statusText">3 объекта</span><span class="resize-grip"></span></footer>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
